services:
  - type: web
    name: comiccraft
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_PRO_MODEL
        value: gemini-flash-lite-latest
